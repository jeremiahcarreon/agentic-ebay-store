# Local stack: Prefect server + the agent's served deployments + the MCP gateway.
#   docker compose up --build
#   Prefect UI:   http://localhost:4200
#   MCP gateway:  http://localhost:8765/mcp (read-only)
x-agent-env: &agent-env
  PREFECT_API_URL: http://prefect:4200/api
  EBAY_AGENT_DATA_DIR: /app/.data
  EBAY_AGENT_APPROVAL_MODE: ${EBAY_AGENT_APPROVAL_MODE:-prefect}
  EBAY_AGENT_ERP_BACKEND: ${EBAY_AGENT_ERP_BACKEND:-mock}
  EBAY_AGENT_INTUNEX_MCP_URL: ${EBAY_AGENT_INTUNEX_MCP_URL:-}
  EBAY_AGENT_INTUNEX_TOKEN: ${EBAY_AGENT_INTUNEX_TOKEN:-}
  EBAY_AGENT_EBAY_BACKEND: ${EBAY_AGENT_EBAY_BACKEND:-simulator}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    volumes: [prefect-data:/root/.prefect]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      retries: 20

  agent:
    build: .
    command: ["serve"]
    environment: *agent-env
    volumes: [store-data:/app/.data]
    depends_on:
      prefect: { condition: service_healthy }

  gateway:
    build: .
    command: ["mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    environment: *agent-env
    volumes: [store-data:/app/.data]
    ports: ["8765:8765"]

volumes:
  prefect-data:
  store-data:
